name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Lint & type-check
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Package VSIX
        run: npm run package:vsix

      - name: Verify VSIX exists
        run: |
          ls -la omniview-*.vsix
          test -f "omniview-$(node -p "require('./package.json').version").vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniview-${{ github.sha }}
          path: omniview-*.vsix
          if-no-files-found: error
          retention-days: 7
