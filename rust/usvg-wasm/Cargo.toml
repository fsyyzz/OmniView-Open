# OmniView usvg-wasm: Rust → WebAssembly 绑定 (ADR-0001 §10)
#
# 把 usvg (https://github.com/linebender/resvg/tree/main/crates/usvg) 的解析能力
# 通过 wasm-bindgen 暴露给浏览器侧 TypeScript 调用。
#
# 产物布局（wasm-pack --target web 输出）：
#   public/usvg-wasm/
#   ├── usvg_wasm.js          # wasm-bindgen 生成的 JS glue
#   ├── usvg_wasm_bg.wasm     # 实际 WASM 二进制
#   └── usvg_wasm.d.ts        # TypeScript 类型定义
#
# 前置条件：
#   - Rust ≥ 1.75
#   - rustup target add wasm32-unknown-unknown
#   - cargo install wasm-pack
#
# 构建命令：
#   npm run build:usvg-wasm
#   # 等价于：
#   wasm-pack build --target web --release --out-dir ../../public/usvg-wasm

[package]
name = "omniview-usvg-wasm"
version = "0.1.0"
edition = "2021"
authors = ["OmniView Contributors"]
license = "MIT OR Apache-2.0"
description = "usvg SVG normalizer compiled to WebAssembly for OmniView SVG Edit Engine v2"
repository = "https://github.com/anomalyco/OmniView"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# 默认 feature = 纯文本 SVG 解析（不包含字体 shaping），适合 P1 阶段。
# 后续 P2/P3 如要支持文本字形精细化，可启用 "text-shaping" 并嵌入字体。
default = []

[dependencies]
# usvg 是 resvg 项目下的 SVG 归一化 / 简化器（per ADR-0001 §10）。
# 跟随 resvg 0.47.0 版本线，避免 emoji fallback PR 拉断我们的构建。
usvg = { version = "0.47", default-features = false }

# wasm-bindgen：Rust ↔ JS 互操作绑定
wasm-bindgen = "0.2"

# serde + serde-wasm-bindgen：Rust 结构体 → JS 对象序列化
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# console_error_panic_hook：把 Rust panic 桥接到 JS console.error，
# 避免 WASM trap 时浏览器静默崩溃。
console_error_panic_hook = "0.1"

[profile.release]
# wasm-bindgen 推荐 release 模式 + LTO + strip + opt-level=z/s
lto = "thin"
opt-level = "z"
codegen-units = 1
panic = "abort"