<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.2" fill="#334155" fill-opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="620" fill="url(#canvasBg)" rx="12" />
  <rect width="1000" height="620" fill="url(#gridPattern)" rx="12" />

  <!-- Header Section -->
  <g transform="translate(40, 45)">
    <circle cx="10" cy="10" r="6" fill="#38bdf8" filter="url(#neonGlow)" />
    <text x="28" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">云原生微服务全链路架构拓扑</text>
    <text x="28" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Cloud-Native Production Distributed Architecture | 实时健康监控: 99.99% SLO</text>
  </g>

  <!-- Boundary: Ingress & Edge -->
  <rect x="40" y="110" width="180" height="460" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-dasharray="5 5" />
  <text x="55" y="135" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">EDGE CLIENTS</text>

  <!-- Client 1: Web Application -->
  <g transform="translate(60, 160)">
    <rect width="140" height="85" rx="8" fill="url(#clientGrad)" stroke="#475569" stroke-width="1.2" />
    <circle cx="25" cy="25" r="4" fill="#38bdf8" />
    <text x="38" y="29" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Web Portal</text>
    <text x="20" y="52" fill="#94a3b8" font-family="monospace" font-size="10">Next.js 15 / SSR</text>
    <text x="20" y="68" fill="#22c55e" font-family="monospace" font-size="9">● TPS: 14.8k / 24ms</text>
  </g>

  <!-- Client 2: Mobile App -->
  <g transform="translate(60, 275)">
    <rect width="140" height="85" rx="8" fill="url(#clientGrad)" stroke="#475569" stroke-width="1.2" />
    <circle cx="25" cy="25" r="4" fill="#a855f7" />
    <text x="38" y="29" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Mobile Client</text>
    <text x="20" y="52" fill="#94a3b8" font-family="monospace" font-size="10">Flutter / iOS / Android</text>
    <text x="20" y="68" fill="#22c55e" font-family="monospace" font-size="9">● TPS: 8.2k / 32ms</text>
  </g>

  <!-- Client 3: IoT Gateway -->
  <g transform="translate(60, 390)">
    <rect width="140" height="85" rx="8" fill="url(#clientGrad)" stroke="#475569" stroke-width="1.2" />
    <circle cx="25" cy="25" r="4" fill="#eab308" />
    <text x="38" y="29" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Edge Sensors</text>
    <text x="20" y="52" fill="#94a3b8" font-family="monospace" font-size="10">MQTT / gRPC TLS</text>
    <text x="20" y="68" fill="#22c55e" font-family="monospace" font-size="9">● Events: 45k/s</text>
  </g>

  <!-- API Gateway Zone -->
  <g transform="translate(260, 190)">
    <rect width="160" height="300" rx="10" fill="url(#gatewayGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="25" y="35" fill="#60a5fa" font-family="sans-serif" font-size="15" font-weight="700">API 网关层</text>
    <text x="25" y="55" fill="#93c5fd" font-family="monospace" font-size="10">Envoy / Envoy Proxy</text>

    <!-- Sub-features -->
    <rect x="15" y="75" width="130" height="40" rx="4" fill="#172554" stroke="#1d4ed8" />
    <text x="25" y="94" fill="#bfdbfe" font-family="sans-serif" font-size="11" font-weight="600">OAuth2 / JWT</text>
    <text x="25" y="106" fill="#60a5fa" font-family="monospace" font-size="9">Zero-Trust Auth</text>

    <rect x="15" y="125" width="130" height="40" rx="4" fill="#172554" stroke="#1d4ed8" />
    <text x="25" y="144" fill="#bfdbfe" font-family="sans-serif" font-size="11" font-weight="600">分布式限流</text>
    <text x="25" y="156" fill="#60a5fa" font-family="monospace" font-size="9">Token Bucket Rate-Limit</text>

    <rect x="15" y="175" width="130" height="40" rx="4" fill="#172554" stroke="#1d4ed8" />
    <text x="25" y="194" fill="#bfdbfe" font-family="sans-serif" font-size="11" font-weight="600">Wasm 动态插件</text>
    <text x="25" y="206" fill="#60a5fa" font-family="monospace" font-size="9">Rust WebAssembly</text>

    <rect x="15" y="225" width="130" height="45" rx="4" fill="#0f172a" stroke="#2563eb" />
    <text x="25" y="244" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">链路观测</text>
    <text x="25" y="258" fill="#38bdf8" font-family="monospace" font-size="9">OpenTelemetry Tracing</text>
  </g>

  <!-- Microservices Cluster -->
  <rect x="460" y="110" width="280" height="460" rx="10" fill="#064e3b" fill-opacity="0.15" stroke="#059669" stroke-dasharray="6 6" />
  <text x="475" y="135" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">K8S SERVICE MESH (ISTIO)</text>

  <!-- Service A: User & Auth -->
  <g transform="translate(480, 155)">
    <rect width="240" height="70" rx="8" fill="url(#serviceGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="20" y="28" fill="#ecfdf5" font-family="sans-serif" font-size="13" font-weight="600">用户与账号微服务</text>
    <text x="20" y="46" fill="#a7f3d0" font-family="monospace" font-size="10">Golang 1.24 / gRPC</text>
    <text x="20" y="60" fill="#6ee7b7" font-family="monospace" font-size="9">Replicas: 8 Pods | P99: 4.2ms</text>
  </g>

  <!-- Service B: Order & Payment -->
  <g transform="translate(480, 245)">
    <rect width="240" height="70" rx="8" fill="url(#serviceGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="20" y="28" fill="#ecfdf5" font-family="sans-serif" font-size="13" font-weight="600">交易订单编排服务</text>
    <text x="20" y="46" fill="#a7f3d0" font-family="monospace" font-size="10">Rust / Actix-Web</text>
    <text x="20" y="60" fill="#6ee7b7" font-family="monospace" font-size="9">Replicas: 16 Pods | P99: 2.1ms</text>
  </g>

  <!-- Service C: Visual Rendering Service -->
  <g transform="translate(480, 335)">
    <rect width="240" height="70" rx="8" fill="url(#serviceGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="20" y="28" fill="#ecfdf5" font-family="sans-serif" font-size="13" font-weight="600">OmniView 渲染引擎池</text>
    <text x="20" y="46" fill="#a7f3d0" font-family="monospace" font-size="10">Node.js + WebGPU Sandbox</text>
    <text x="20" y="60" fill="#6ee7b7" font-family="monospace" font-size="9">Replicas: 12 Pods | 60 FPS Engine</text>
  </g>

  <!-- Service D: AI Assistant Streamer -->
  <g transform="translate(480, 425)">
    <rect width="240" height="70" rx="8" fill="url(#serviceGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="20" y="28" fill="#ecfdf5" font-family="sans-serif" font-size="13" font-weight="600">AI 智能流式推理引擎</text>
    <text x="20" y="46" fill="#a7f3d0" font-family="monospace" font-size="10">Python / vLLM / TensorRT</text>
    <text x="20" y="60" fill="#6ee7b7" font-family="monospace" font-size="9">GPU: 4x H100 | SSE Streaming</text>
  </g>

  <!-- Data Tier -->
  <rect x="780" y="110" width="180" height="460" rx="10" fill="#1e1b4b" fill-opacity="0.3" stroke="#6366f1" stroke-dasharray="5 5" />
  <text x="795" y="135" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="600">DATA PERSISTENCE</text>

  <!-- Database: PostgreSQL -->
  <g transform="translate(800, 160)">
    <rect width="140" height="85" rx="8" fill="url(#dbGrad)" stroke="#9333ea" stroke-width="1.2" />
    <text x="20" y="30" fill="#faf5ff" font-family="sans-serif" font-size="13" font-weight="600">PostgreSQL HA</text>
    <text x="20" y="50" fill="#d8b4fe" font-family="monospace" font-size="10">Primary + 3 Read-Pool</text>
    <text x="20" y="68" fill="#c084fc" font-family="monospace" font-size="9">Connection: PgBouncer</text>
  </g>

  <!-- Cache: Redis Cluster -->
  <g transform="translate(800, 275)">
    <rect width="140" height="85" rx="8" fill="url(#cacheGrad)" stroke="#ea580c" stroke-width="1.2" />
    <text x="20" y="30" fill="#fff7ed" font-family="sans-serif" font-size="13" font-weight="600">Redis Cluster</text>
    <text x="20" y="50" fill="#fdba74" font-family="monospace" font-size="10">6 Shards In-Memory</text>
    <text x="20" y="68" fill="#fb923c" font-family="monospace" font-size="9">Hit Rate: 98.4%</text>
  </g>

  <!-- Object Storage: MinIO / S3 -->
  <g transform="translate(800, 390)">
    <rect width="140" height="85" rx="8" fill="url(#clientGrad)" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="20" y="30" fill="#f0f9ff" font-family="sans-serif" font-size="13" font-weight="600">S3 矢量素材库</text>
    <text x="20" y="50" fill="#7dd3fc" font-family="monospace" font-size="10">Ceph / MinIO Cluster</text>
    <text x="20" y="68" fill="#38bdf8" font-family="monospace" font-size="9">Capacity: 48 TB</text>
  </g>

  <!-- Connective Arrows & Data Flows -->
  <!-- Clients -> Gateway -->
  <path d="M 200 202 L 260 260" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 3" />
  <path d="M 200 317 L 260 340" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="4 3" />
  <path d="M 200 432 L 260 410" stroke="#eab308" stroke-width="1.8" stroke-dasharray="4 3" />

  <!-- Gateway -> Services -->
  <path d="M 420 250 L 480 190" stroke="#3b82f6" stroke-width="2" />
  <path d="M 420 290 L 480 280" stroke="#3b82f6" stroke-width="2" />
  <path d="M 420 370 L 480 370" stroke="#3b82f6" stroke-width="2" />
  <path d="M 420 440 L 480 460" stroke="#3b82f6" stroke-width="2" />

  <!-- Services -> Data Tier -->
  <path d="M 720 190 L 800 202" stroke="#10b981" stroke-width="1.8" />
  <path d="M 720 280 L 800 317" stroke="#10b981" stroke-width="1.8" />
  <path d="M 720 370 L 800 432" stroke="#10b981" stroke-width="1.8" />

  <!-- Footer Info -->
  <text x="40" y="600" fill="#475569" font-family="sans-serif" font-size="11">OmniView High-Precision Vector Engine</text>
</svg>
