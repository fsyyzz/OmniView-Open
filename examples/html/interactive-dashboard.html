<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniView HTML5 交互式演示仪表盘</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #38bdf8;
        --primary-hover: #0ea5e9;
        --bg-page: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text);
      line-height: 1.6;
      padding: 32px 24px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px 0;
      color: var(--primary);
      font-size: 26px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 9999px;
      background-color: rgba(2, 132, 199, 0.12);
      color: var(--primary);
      border: 1px solid var(--primary);
      margin-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .metric {
      font-size: 32px;
      font-weight: 700;
      margin: 8px 0;
      color: var(--primary);
    }
    .chart-container {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      height: 120px;
      padding-top: 16px;
    }
    .bar {
      flex: 1;
      background: linear-gradient(180deg, var(--primary) 0%, rgba(2, 132, 199, 0.4) 100%);
      border-radius: 4px 4px 0 0;
      transition: height 0.4s ease;
      position: relative;
    }
    .bar:hover {
      background: var(--primary-hover);
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">OmniView Native HTML5 Studio</span>
      <h1>工程质量监控与沙箱演播大屏</h1>
      <p style="color: var(--text-muted); margin: 0; font-size: 14px;">
        双层隔离安全沙箱 · 响应式设备仿真切换 · 实时热预览
      </p>
    </header>

    <div class="grid">
      <div class="card">
        <h3 style="margin-top:0; font-size: 15px;">自动化单测通过率</h3>
        <p class="metric" style="color: var(--success);">100%</p>
        <span style="color: var(--text-muted); font-size: 12px;">80+ 测试用例全绿通过</span>
      </div>
      <div class="card">
        <h3 style="margin-top:0; font-size: 15px;">多格式驱动覆盖数</h3>
        <p class="metric">22+</p>
        <span style="color: var(--text-muted); font-size: 12px;">覆盖文档、报表、矢量图与云原生</span>
      </div>
      <div class="card">
        <h3 style="margin-top:0; font-size: 15px;">沙箱宿主越界拦截</h3>
        <p class="metric" style="color: var(--primary);">0 漏洞</p>
        <span style="color: var(--text-muted); font-size: 12px;">严格 iframe sandbox 阻断父级穿透</span>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; font-size: 16px;">模拟性能稳态吞吐 (QPS)</h3>
        <button class="btn" onclick="randomizeData()">刷新随机模拟数据</button>
      </div>
      <div class="chart-container" id="chart">
        <div class="bar" style="height: 60%;" title="Mon: 60 QPS"></div>
        <div class="bar" style="height: 75%;" title="Tue: 75 QPS"></div>
        <div class="bar" style="height: 45%;" title="Wed: 45 QPS"></div>
        <div class="bar" style="height: 90%;" title="Thu: 90 QPS"></div>
        <div class="bar" style="height: 80%;" title="Fri: 80 QPS"></div>
        <div class="bar" style="height: 95%;" title="Sat: 95 QPS"></div>
        <div class="bar" style="height: 70%;" title="Sun: 70 QPS"></div>
      </div>
    </div>
  </div>

  <script>
    function randomizeData() {
      const bars = document.querySelectorAll('.bar');
      bars.forEach(bar => {
        const val = Math.floor(Math.random() * 60) + 35;
        bar.style.height = val + '%';
      });
    }
  </script>
</body>
</html>
